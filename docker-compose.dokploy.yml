services:
  nginx:
    image: nginx:alpine
    ports:
      - "2026:2026"
    volumes:
      - ../files/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - gateway
      - langgraph
      - frontend
    restart: unless-stopped
    networks:
      - deer-flow-network
      - dokploy-network

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run uvicorn src.gateway.app:app --host 0.0.0.0 --port 8001
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      - DEER_FLOW_CONFIG_PATH=/app/config.yaml
    volumes:
      - ../files/config.yaml:/app/config.yaml:ro
    restart: unless-stopped
    networks:
      - deer-flow-network

  langgraph:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: uv run langgraph serve --host 0.0.0.0 --port 2024
    expose:
      - "2024"
    env_file:
      - .env
    environment:
      - DEER_FLOW_CONFIG_PATH=/app/config.yaml
    volumes:
      - ../files/config.yaml:/app/config.yaml:ro
      - deerflow-state:/app/.deer-flow
    restart: unless-stopped
    networks:
      - deer-flow-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_LANGGRAPH_BASE_URL=/api/langgraph
        - NEXT_PUBLIC_BACKEND_BASE_URL=
    expose:
      - "3000"
    env_file:
      - .env
    depends_on:
      - gateway
    restart: unless-stopped
    networks:
      - deer-flow-network

networks:
  deer-flow-network:
    driver: bridge
  dokploy-network:
    external: true

volumes:
  deerflow-state:
