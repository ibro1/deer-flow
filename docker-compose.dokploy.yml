services:
  aio-sandbox:
    image: ghcr.io/agent-infra/sandbox:latest
    container_name: deer-flow-sandbox
    entrypoint: 
      ["/bin/sh", "-c",
       "ln -sf /mnt/shared /opt/jupyter/shared_workspace && exec /opt/gem/run.sh"]
    security_opt:
      - seccomp:unconfined
    shm_size: "8gb"
    mem_limit: "16g"
    memswap_limit: "16g"
    cpus: "4"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Africa/Lagos
      - WORKSPACE=/home/gem
    volumes:
      # Shared workspace for VS Code/Jupyter and DeerFlow
      # In VS Code/Jupyter use: /mnt/shared
      - /etc/dokploy/compose/projects-deeflow-hlwseh/files/shared-workspace:/mnt/shared
      # DeerFlow state visible from VS Code/Jupyter for inspection
      # In VS Code/Jupyter use: /mnt/deerflow-state
      - /etc/dokploy/compose/projects-deeflow-hlwseh/files/deerflow-state:/mnt/deerflow-state
    restart: unless-stopped
    networks:
      - deer-flow-network

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: sh -c "umask 000 && cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      - CI=true
      - UMASK=000
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_ENABLE_CUSTOM_AGENTS=true
      # Important: host path and container path must match for Docker socket bind mounts
      - DEER_FLOW_HOME=/etc/dokploy/compose/projects-deeflow-hlwseh/files/deerflow-state
      - DEER_FLOW_SKILLS_PATH=${DEER_FLOW_SKILLS_PATH}
      - MCP_API_KEY=${MCP_API_KEY}
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://gateway:8001/api
      - DEER_FLOW_CHANNELS_GATEWAY_URL=http://gateway:8001
      - GATEWAY_CORS_ORIGINS=https://deer.linkfa.de
      - AUTH_JWT_SECRET=${BETTER_AUTH_SECRET}

      # Important: gateway container must reach sandbox through Docker host
      - DEER_FLOW_SANDBOX_HOST=host.docker.internal
    volumes:
      - ../files/config.yaml:/app/backend/config.yaml:ro
      - ../files/extensions_config.json.fix:/app/backend/extensions_config.json:ro
      - /etc/dokploy/compose/projects-deeflow-hlwseh/files/deerflow-state:/etc/dokploy/compose/projects-deeflow-hlwseh/files/deerflow-state
      - /etc/dokploy/compose/projects-deeflow-hlwseh/files/deerflow-state:/app/backend/.deer-flow
      # Shared workspace, mounted at same path as DeerFlow config below
      - /etc/dokploy/compose/projects-deeflow-hlwseh/files/shared-workspace:/mnt/shared

      # Required so gateway can start dynamic sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - seccomp:unconfined
    depends_on:
      - aio-sandbox
    restart: unless-stopped
    networks:
      - deer-flow-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: /root/.local/share/pnpm/store
        NPM_REGISTRY: ""
    expose:
      - "3000"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://deer.linkfa.de
      - BETTER_AUTH_TRUSTED_ORIGINS=https://deer.linkfa.de
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - NEXT_PUBLIC_API_URL=https://deer.linkfa.de
      - NEXT_PUBLIC_LANGGRAPH_BASE_URL=https://deer.linkfa.de/api/langgraph
    volumes:
      - /etc/dokploy/compose/projects-deeflow-hlwseh/files/frontend-data:/app/.next
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - deer-flow-network

  nginx:
    image: nginx:alpine
    ports:
      - "2026:2026"
    volumes:
      - ../files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - gateway
      - aio-sandbox
    restart: unless-stopped
    networks:
      - deer-flow-network
      - dokploy-network

networks:
  deer-flow-network:
    driver: bridge
  dokploy-network:
    external: true
