services:
  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://gateway:8001/api
      - DEER_FLOW_CHANNELS_GATEWAY_URL=http://gateway:8001
    volumes:
      - ../files/config.yaml:/app/backend/config.yaml:ro
      - ../files/extensions_config.json.fix:/app/backend/extensions_config.json:ro
      - ../files/deerflow-state:/app/backend/.deer-flow
    restart: unless-stopped
    networks:
      - deer-flow-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: /root/.local/share/pnpm/store
        NPM_REGISTRY: ""
    expose:
      - "3000"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - deer-flow-network

  nginx:
    image: nginx:alpine
    ports:
      - "2026:2026"
    command: >
      sh -c "printf 'resolver 127.0.0.11 valid=10s ipv6=off;\nserver {\n  listen 2026;\n  location ~* ^/(swagger|api-docs|\\.env|\\.git|wp-admin|debug|trace) { return 444; }\n  location / {\n    set \$\$uf frontend:3000;\n    proxy_pass http://\$\$uf;\n    proxy_http_version 1.1;\n    proxy_set_header Connection \"\";\n    proxy_set_header Host \$\$host;\n    proxy_set_header X-Real-IP \$\$remote_addr;\n    proxy_set_header X-Forwarded-Proto \$\$scheme;\n    proxy_read_timeout 600s;\n  }\n  location /api/langgraph/ {\n    set \$\$ug gateway:8001;\n    rewrite ^/api/langgraph/(.*) /api/\$\$1 break;\n    proxy_pass http://\$\$ug;\n    proxy_http_version 1.1;\n    proxy_set_header Connection \"\";\n    proxy_buffering off;\n    proxy_read_timeout 3600s;\n    proxy_set_header Host \$\$host;\n    proxy_set_header X-Forwarded-Proto \$\$scheme;\n  }\n  location /api/ {\n    set \$\$ug gateway:8001;\n    proxy_pass http://\$\$ug;\n    proxy_http_version 1.1;\n    proxy_set_header Connection \"\";\n    proxy_buffering off;\n    proxy_read_timeout 3600s;\n    client_max_body_size 100M;\n    proxy_set_header Host \$\$host;\n    proxy_set_header X-Forwarded-Proto \$\$scheme;\n  }\n}\n' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped
    networks:
      - deer-flow-network
      - dokploy-network

networks:
  deer-flow-network:
    driver: bridge
  dokploy-network:
    external: true
