services:
  aio-sandbox:
    image: ghcr.io/agent-infra/sandbox:latest
    container_name: deer-flow-sandbox
    security_opt:
      - seccomp:unconfined
    shm_size: "8gb"
    mem_limit: "16g"
    memswap_limit: "16g"
    cpus: "4"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Singapore
      - WORKSPACE=/mnt/user-data/workspace
    volumes:
      - /opt/deerflow/workspace:/mnt/user-data/workspace
      - /opt/deerflow/uploads:/mnt/user-data/uploads
      - /opt/deerflow/outputs:/mnt/user-data/outputs
    restart: unless-stopped
    networks:
      - deer-flow-network

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://gateway:8001/api
      - DEER_FLOW_CHANNELS_GATEWAY_URL=http://gateway:8001
      - GATEWAY_CORS_ORIGINS=https://deer.linkfa.de
      - AUTH_JWT_SECRET=${BETTER_AUTH_SECRET}
    volumes:
      - ../files/config.yaml:/app/backend/config.yaml:ro
      - ../files/extensions_config.json.fix:/app/backend/extensions_config.json:ro
      - ../files/deerflow-state:/app/backend/.deer-flow
      - /opt/deerflow/workspace:/mnt/user-data/workspace
      - /opt/deerflow/uploads:/mnt/user-data/uploads
      - /opt/deerflow/outputs:/mnt/user-data/outputs
      - /var/run/docker.sock:/var/run/docker.sock
    security_opt:
      - seccomp:unconfined
    depends_on:
      - aio-sandbox
    restart: unless-stopped
    networks:
      - deer-flow-network

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: /root/.local/share/pnpm/store
        NPM_REGISTRY: ""
    expose:
      - "3000"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=https://deer.linkfa.de
      - BETTER_AUTH_TRUSTED_ORIGINS=https://deer.linkfa.de
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
      - NEXT_PUBLIC_API_URL=https://deer.linkfa.de
      - NEXT_PUBLIC_LANGGRAPH_BASE_URL=https://deer.linkfa.de/api/langgraph
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - deer-flow-network

  nginx:
    image: nginx:alpine
    ports:
      - "2026:2026"
    volumes:
      - ../files/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - gateway
    restart: unless-stopped
    networks:
      - deer-flow-network
      - dokploy-network

networks:
  deer-flow-network:
    driver: bridge
  dokploy-network:
    external: true
