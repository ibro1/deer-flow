services:
  nginx:
    image: nginx:alpine
    ports:
      - "2026:2026"
    volumes:
      - ../files/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - gateway
    networks:
      - deer-flow-network
      - dokploy-network
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: prod
      args:
        PNPM_STORE_PATH: /root/.local/share/pnpm/store
        NPM_REGISTRY: ""
    expose:
      - "3000"
    environment:
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - DEER_FLOW_INTERNAL_GATEWAY_BASE_URL=http://gateway:8001
    env_file:
      - .env
    networks:
      - deer-flow-network
    restart: unless-stopped

  gateway:
    build:
      context: .
      dockerfile: backend/Dockerfile
    working_dir: /app
    command: sh -c "cd backend && PYTHONPATH=. uv run uvicorn app.gateway.app:app --host 0.0.0.0 --port 8001 --workers 2"
    expose:
      - "8001"
    volumes:
      - ../files/config.yaml:/app/backend/config.yaml:ro
      - ../files/extensions_config.json:/app/backend/extensions_config.json:ro
      - ../files/deerflow-state:/app/backend/.deer-flow
    environment:
      - CI=true
      - DEER_FLOW_PROJECT_ROOT=/app
      - DEER_FLOW_HOME=/app/backend/.deer-flow
      - DEER_FLOW_CONFIG_PATH=/app/backend/config.yaml
      - DEER_FLOW_EXTENSIONS_CONFIG_PATH=/app/backend/extensions_config.json
      - DEER_FLOW_CHANNELS_LANGGRAPH_URL=http://gateway:8001/api
      - DEER_FLOW_CHANNELS_GATEWAY_URL=http://gateway:8001
    env_file:
      - .env
    networks:
      - deer-flow-network
    restart: unless-stopped

networks:
  deer-flow-network:
    driver: bridge
  dokploy-network:
    external: true
